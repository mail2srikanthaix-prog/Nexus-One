# =============================================================================
# Nexus-One Prometheus Configuration
# Scrape configs for: Next.js app, PostgreSQL, Redis, Node, Kafka
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    cluster: "nexus-one"
    environment: "production"
    region: "us-east-1"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

# Rule files for alerting rules
rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # ─── Prometheus Self-Monitoring ──────────────────────────────────────────
  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # ─── Next.js Application Metrics ────────────────────────────────────────
  - job_name: "nexus-one-app"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "app:9091"
        labels:
          service: "nexus-one"
          component: "application"
    # Kubernetes service discovery for production
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - nexus-one
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: nexus-one
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+)
        replacement: ${1}:9091
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  # ─── PostgreSQL Exporter ────────────────────────────────────────────────
  - job_name: "postgres"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          service: "nexus-one"
          component: "database"
          db_type: "postgresql"

  # ─── Redis Exporter ─────────────────────────────────────────────────────
  - job_name: "redis"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "redis-exporter:9121"
        labels:
          service: "nexus-one"
          component: "cache"
          db_type: "redis"

  # ─── Node Exporter (System Metrics) ─────────────────────────────────────
  - job_name: "node"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          service: "nexus-one"
          component: "infrastructure"
    # Kubernetes node discovery
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - monitoring
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        regex: node-exporter
        action: keep

  # ─── Kafka Metrics (JMX Exporter) ──────────────────────────────────────
  - job_name: "kafka"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "kafka-jmx-exporter:9999"
        labels:
          service: "nexus-one"
          component: "messaging"
          messaging_system: "kafka"

  # ─── Neo4j Metrics ─────────────────────────────────────────────────────
  - job_name: "neo4j"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "neo4j:2004"
        labels:
          service: "nexus-one"
          component: "graph"
          db_type: "neo4j"

  # ─── Qdrant Vector DB Metrics ──────────────────────────────────────────
  - job_name: "qdrant"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "qdrant:6333"
        labels:
          service: "nexus-one"
          component: "vector-search"
          db_type: "qdrant"

  # ─── Grafana Metrics ───────────────────────────────────────────────────
  - job_name: "grafana"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "grafana:3000"
        labels:
          service: "monitoring"
          component: "grafana"
