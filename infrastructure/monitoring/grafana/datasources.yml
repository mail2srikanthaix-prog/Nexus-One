# =============================================================================
# Grafana Dashboard Provider Configuration
# =============================================================================
apiVersion: 1
providers:
  - name: "Nexus-One Dashboards"
    orgId: 1
    folder: "Nexus-One"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
